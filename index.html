<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desirene LLC</title>
<meta name="description" content="Desirene LLC makes software for cross-stitchers.">
<style>
	:root {
		--bg: #faf6f1;
		--card: #ffffff;
		--ink: #33291f;
		--muted: #665c53;
		--rose: #8c384c;
		--edge: rgba(51, 41, 31, 0.10);
		--grid: rgba(51, 41, 31, 0.05);
	}
	@media (prefers-color-scheme: dark) {
		:root {
			--bg: #1c1814;
			--card: #2a231e;
			--ink: #f3ece4;
			--muted: #abaab0;
			--rose: #f2949e;
			--edge: rgba(255, 255, 255, 0.12);
			--grid: rgba(255, 255, 255, 0.04);
		}
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; }
	body {
		min-height: 100vh;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		padding: 48px 16px;
		background-color: var(--bg);
		/* A faint grid, like Aida cloth. */
		background-image:
			linear-gradient(var(--grid) 1px, transparent 1px),
			linear-gradient(90deg, var(--grid) 1px, transparent 1px);
		background-size: 14px 14px;
		color: var(--ink);
		font: 17px/1.55 ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
	}
	main {
		width: 100%;
		max-width: 560px;
		background: var(--card);
		border: 1px solid var(--edge);
		border-radius: 20px;
		padding: 36px 32px;
		box-shadow: 0 6px 28px rgba(0, 0, 0, 0.06);
	}
	h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 12px; }
	p { margin: 0 0 16px; }
	.muted { color: var(--muted); }
	a { color: var(--rose); text-underline-offset: 3px; }
	h2 { font-size: 1.05rem; margin: 28px 0 6px; }
	footer { margin-top: 24px; font-size: 0.9rem; color: var(--muted); }
	@media (max-width: 480px) { main { padding: 28px 22px; } h1 { font-size: 1.7rem; } }
</style>
</head>
<body>
<main>
	<h1>Desirene LLC</h1>
	<p class="muted">Desirene LLC makes software for cross-stitchers.</p>

	<h2>Contact</h2>
	<p><a href="mailto:support@desirenellc.com">support@desirenellc.com</a></p>
</main>
<footer>© 2026 Desirene LLC</footer>
</body>
</html>
